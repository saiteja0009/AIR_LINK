<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRLINK | Reset Password</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f8fcff, #eef7ff, #e8f4ff);
            color: #172b4d;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            width: 420px; max-width: 100%;
            background: white; border-radius: 20px;
            padding: 36px; box-shadow: 0 15px 45px rgba(40, 90, 140, 0.12);
            border: 1px solid #dceaf7; text-align: center;
        }
        .icon-box {
            width: 56px; height: 56px; margin: 0 auto 18px;
            background: #dcfce7; color: #16a34a; border-radius: 16px;
            display: flex; align-items: center; justify-content: center; font-size: 26px;
        }
        h2 { margin: 0 0 8px; font-size: 24px; color: #0f172a; }
        p { margin: 0 0 24px; font-size: 13px; color: #64748b; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label {
            display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700;
            color: #475569; text-transform: uppercase;
        }
        .form-group input {
            width: 100%; height: 48px; padding: 0 14px;
            border: 1px solid #cbd5e1; border-radius: 10px;
            background: #f8fafc; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: #16a34a; background: white; }
        .btn {
            width: 100%; height: 48px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #16a34a, #059669);
            color: white; font-weight: 700; font-size: 14px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25); transition: 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .error { background: #fff1f2; border: 1px solid #fecdd3; color: #e11d48; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 18px; text-align: left; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">🔒</div>
        <h2>Create New Password</h2>
        <p>Set a strong password for your AIRLINK account.</p>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('reset_password') }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn">Update Password & Login →</button>
        </form>
    </div>

</body>
</html>
