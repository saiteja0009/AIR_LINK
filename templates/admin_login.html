<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRLINK | Admin Portal Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f2744);
            color: #f8fafc;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .admin-login-card {
            width: 420px; max-width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .admin-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #38bdf8;
            padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .admin-login-card h2 {
            margin: 0 0 8px; font-size: 26px; color: #ffffff;
        }
        .admin-subtitle {
            margin: 0 0 28px; font-size: 13px; color: #94a3b8;
        }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label {
            display: block; margin-bottom: 8px;
            font-size: 11px; font-weight: 700; color: #cbd5e1;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; height: 48px; padding: 0 16px;
            border: 1px solid #334155; border-radius: 12px;
            background: #0f172a; color: #ffffff;
            outline: none; font-size: 14px; transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .admin-btn {
            width: 100%; height: 50px; margin-top: 10px;
            border: none; border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: 0.25s;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
        }
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(2, 132, 199, 0.4);
        }
        .error {
            background: rgba(225, 29, 72, 0.15);
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: #f43f5e; padding: 12px; border-radius: 10px;
            font-size: 13px; margin-bottom: 20px; text-align: left;
        }
        .back-link {
            margin-top: 24px; font-size: 13px; color: #64748b;
        }
        .back-link a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-badge">
            ⚡ RESTRICTED ACCESS
        </div>

        <h2>AIRLINK Admin Portal</h2>
        <p class="admin-subtitle">Sign in to manage platform users, flights, & ML analytics</p>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login_page') }}">
            <div class="form-group">
                <label for="username">Admin Username or Email</label>
                <input type="text" id="username" name="username" placeholder="admin@airlink.com" required>
            </div>

            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="admin-btn">
                Authorize & Login →
            </button>
        </form>

        <div class="back-link">
            Not an Admin? <a href="{{ url_for('login_page') }}">Customer Login</a>
        </div>
    </div>

</body>
</html>
